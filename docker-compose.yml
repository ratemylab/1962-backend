services:
  api:
    build: .
    ports:
      - "8085:8085"
    env_file:
      - .env.docker
    depends_on:
      - postgres
    volumes:
      - audio_uploads:/app/uploads/audio
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  audio_uploads:
